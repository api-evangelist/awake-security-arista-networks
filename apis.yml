description: 'Awake Security was a network detection and response (NDR) company founded in 2014 that
  used AI and machine learning to analyze network traffic and detect threats, compromised devices, and
  malicious insiders without relying on agents or signatures. Arista Networks acquired Awake Security
  in 2020 and the technology now ships as Arista NDR within Arista''s security portfolio. The former
  awakesecurity.com domain redirects to Arista''s security solutions site; the product has no distinct
  public developer API, OpenAPI specification, developer portal, or SDK program of its own. Originally
  surfaced as a portfolio company of Bain Capital Ventures. Sector: security.'
